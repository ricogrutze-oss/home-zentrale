<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home-Zentrale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Gestaltung
   - Tiefblauer "Abendhimmel" statt Schwarz: ruhig an der Wand, blendet nicht
   - Bricolage Grotesque für Uhr und Überschriften, Atkinson Hyperlegible
     für alles, was man aus 3 m Entfernung lesen muss
   - Das eine Farbige: die Schulfächer in den Farben von Ilses Magnetkärtchen
   ===================================================================== */
:root{
  --sky:#132235;        /* Hintergrund */
  --sky-2:#1a2d44;      /* Fläche (Schultafel, Wochenspalten) */
  --sky-3:#24395387;    /* Trennlinien, leise Flächen */
  --paper:#f4f2ee;      /* Schrift */
  --mist:#9db0c4;       /* leise Schrift */
  --dawn:#ffc46b;       /* Hervorhebung: jetzt, heute, Mitbringen */
  --rain:#8fd0ff;       /* Regen, Kälte */
  --display:'Bricolage Grotesque','Segoe UI',Roboto,sans-serif;
  --read:'Atkinson Hyperlegible','Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--sky);
  background-image:radial-gradient(120% 80% at 85% -10%, #22405f 0%, rgba(19,34,53,0) 60%);
  color:var(--paper);font-family:var(--read);
  -webkit-user-select:none;user-select:none;overflow:hidden;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}

/* ---------- Kopf: Uhr links, Wetter-Satz rechts ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 28px 6px;gap:24px}
.clock{font-family:var(--display);font-weight:300;font-size:84px;line-height:.86;letter-spacing:-3px;font-variant-numeric:tabular-nums;font-optical-sizing:auto}
.date{font-family:var(--display);font-weight:500;font-size:22px;color:var(--mist);margin-top:8px}
.now-weather{text-align:right;max-width:46%}
.now-weather .row{display:flex;align-items:center;justify-content:flex-end;gap:14px}
.now-weather .ico{font-size:40px;line-height:1}
.now-weather .t{font-family:var(--display);font-weight:300;font-size:48px;line-height:.9;letter-spacing:-1px}
.now-weather .mx{font-size:17px;color:var(--mist);margin-left:4px}
.now-weather .say{font-size:17px;margin-top:6px;line-height:1.3}
.now-weather .say b{color:var(--dawn);font-weight:700}
.now-weather .sub{font-size:14px;color:var(--mist);margin-top:3px}

/* ---------- Hauptbereich ---------- */
main{flex:1;min-height:0;position:relative;padding:14px 28px 10px;overflow:hidden}
nav{flex-shrink:0}
header{flex-shrink:0}
body{height:100vh;height:100dvh}
.view{display:none;height:100%}
.view.active{display:block}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.2px;margin-bottom:10px}
h2 small{font-family:var(--read);font-weight:400;font-size:15px;color:var(--mist);margin-left:8px;letter-spacing:0}

/* Startansicht: oben Schulzeile, darunter heute groß + die nächsten 6 Tage */
#view-start.active{display:flex;flex-direction:column}
.start{display:grid;grid-template-columns:minmax(300px,.85fr) 1.6fr;grid-gap:28px;flex:1;min-height:0}
.today-h{font-size:28px;margin-bottom:8px}
.col{min-height:0;display:flex;flex-direction:column}

.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;flex:1;padding-right:4px}
.scroll::-webkit-scrollbar{width:0}

/* ---------- Termine als Zeitleiste ---------- */
.day{margin-bottom:18px}
.day-name{font-family:var(--display);font-weight:500;font-size:20px;color:var(--mist);margin-bottom:6px}
.day-name.today{color:var(--paper)}
.ev{display:grid;grid-template-columns:68px 5px 1fr;grid-column-gap:12px;align-items:stretch;padding:7px 0}
.ev .tm{font-size:19px;color:var(--mist);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums}
.ev .tm span{display:block;font-size:13px;opacity:.75}
.ev .bar{border-radius:2px}
.ev .ti{font-size:25px;line-height:1.22}
.ev .me{font-size:15px;color:var(--mist);margin-top:1px}
.ev.allday .tm{font-size:13px;padding-top:5px}
.ev.past{opacity:.38}
.ev.now .ti{color:var(--dawn)}
.ev.now .tm{color:var(--dawn)}
.empty{color:var(--mist);font-size:17px;padding:6px 0 4px 74px}
.legend{font-size:13px;color:var(--mist);padding-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 6px 0 14px;vertical-align:1px}
.legend i:first-child{margin-left:0}

/* ---------- Schulzeile mit Magnetkärtchen (klein) ---------- */
.kids-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));grid-gap:10px;margin-bottom:16px;cursor:pointer}
.kidc{background:var(--sky-2);border-radius:14px;padding:10px 12px 9px}
.kid-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:8px}
.kid-name{font-family:var(--display);font-weight:700;font-size:17px}
.kid-when{font-size:13px;color:var(--mist);white-space:nowrap}
.mags{display:flex;flex-wrap:wrap;gap:4px}
.mag{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;line-height:1;padding:6px 8px 5px;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.28)}
.mag em{font-style:normal;font-weight:400;font-size:11px;opacity:.8}
.mag.after{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1.5px var(--mist)}
.mag.after em{opacity:.85}
.bring{margin-top:6px;font-size:13px;color:var(--dawn)}
.free{font-size:15px;padding:2px 0}

/* ---------- Die nächsten 6 Tage (Start) ---------- */
.weekstrip{display:grid;grid-template-columns:repeat(6,1fr);grid-gap:8px;min-height:0}
.weekstrip .wcol{padding:10px 8px}
.weekstrip .wh b{font-size:17px}
.weekstrip .wev .ti{font-size:15px}
.wev .ti{-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}

/* ---------- Wochenansicht ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);grid-gap:10px;height:100%}
.wcol{background:var(--sky-2);border-radius:16px;padding:12px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:3px solid transparent}
.wcol::-webkit-scrollbar{width:0}
.wcol.today{border-top-color:var(--dawn)}
.wh{margin-bottom:10px}
.wh b{font-family:var(--display);font-weight:700;font-size:19px;display:block}
.wh span{font-size:14px;color:var(--mist)}
.wev{border-left:4px solid;padding:3px 0 3px 8px;margin-bottom:10px}
.wev .tm{font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums}
.wev .ti{font-size:16px;line-height:1.25}
.wev.past{opacity:.4}
.wempty{color:var(--mist);font-size:14px}

/* ---------- Schul-Ansicht ---------- */
.plans{height:100%;overflow-y:auto}
.plan + .plan{margin-top:24px}
.plan table{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
.plan th{font-family:var(--display);font-weight:500;font-size:17px;color:var(--mist);padding:2px 0 4px}
.plan th.hl{color:var(--dawn)}
.plan td{text-align:center;vertical-align:middle;height:44px}
.plan td.n{text-align:right;color:var(--mist);font-size:13px;white-space:nowrap;width:92px;padding-right:6px;line-height:1.3}
.plan td.n b{display:block;font-size:15px;color:var(--paper);font-weight:400}
.plan td .mag{width:100%;justify-content:center;padding:11px 6px 10px;font-size:15px}
.plan td .mag em{font-size:12px}
.plan td.hl .mag{outline:3px solid var(--dawn);outline-offset:1px}
.plan td.hl.e{box-shadow:inset 0 0 0 1px var(--sky-3);border-radius:7px}

/* ---------- Heizung ---------- */
.frame{width:100%;height:100%;border:0;border-radius:16px;background:#fff}
.notice{background:var(--sky-2);border-radius:20px;padding:36px;color:var(--mist);font-size:18px;line-height:1.6;max-width:640px}
.notice code{color:var(--paper);background:var(--sky);padding:2px 6px;border-radius:5px}

/* ---------- Leiste unten ---------- */
nav{display:flex;align-items:stretch;padding:0 16px;border-top:1px solid var(--sky-3)}
nav button{flex:1;background:none;border:0;color:var(--mist);font-family:var(--display);font-weight:500;font-size:19px;
  padding:14px 0 16px;cursor:pointer;position:relative}
nav button .ni{font-size:20px;margin-right:8px;vertical-align:-2px;filter:grayscale(1);opacity:.75}
nav button.active{color:var(--paper)}
nav button.active .ni{filter:none;opacity:1}
nav button.active:after{content:'';position:absolute;left:30%;right:30%;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--dawn)}
nav button:focus-visible{outline:2px solid var(--dawn);outline-offset:-4px;border-radius:8px}
.status{position:absolute;right:28px;bottom:2px;font-size:11px;color:var(--mist);opacity:.6}
.demo{position:absolute;left:28px;bottom:2px;font-size:12px;color:var(--dawn)}

/* ---------- Nacht ---------- */
#night{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#05080d;z-index:10;
  flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#night.on{display:flex}
#night .clock{font-size:150px;color:#3a4a5e}
#night .date{color:#2b3747;font-size:24px}
#night .nw{color:#2b3747;font-size:22px;margin-top:12px;font-family:var(--read)}

/* ---------- Schmal (Handy / Hochformat) ---------- */
@media (max-width:860px){
  header{flex-direction:column;align-items:flex-start;padding:14px 16px 4px}
  .clock{font-size:72px}
  .now-weather{text-align:left;max-width:none}
  .now-weather .row{justify-content:flex-start}
  .now-weather .t{font-size:52px}
  main{padding:10px 16px 28px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .status,.demo{position:static;display:block;margin-top:12px}
  .start{grid-template-columns:1fr;grid-gap:20px;height:auto}
  .weekstrip{grid-template-columns:1fr 1fr}
  #view-start.active{display:block}
  .view.active{height:auto}
  .scroll{overflow:visible}
  .week{grid-template-columns:1fr;height:auto}
  #view-heizung.active{height:70vh}
  nav button{font-size:15px}
  nav button .ni{display:block;margin:0 0 2px}
}
@media (prefers-reduced-motion:no-preference){
  .view.active{animation:show .25s ease-out}
  @keyframes show{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>
  <div class="now-weather" id="nowWeather"></div>
</header>

<main>
  <section class="view active" id="view-start">
    <div class="kids-strip" id="schoolTile" role="button" tabindex="0" aria-label="Stundenplan öffnen"></div>
    <div class="start">
      <div class="col today-col">
        <h2 class="today-h">Heute</h2>
        <div class="scroll" id="agenda"><div class="empty">Termine werden geladen …</div></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="weekstrip" id="weekStrip"></div>
    </div>
  </section>

  <section class="view" id="view-kalender"><div class="week" id="week"></div></section>
  <section class="view" id="view-schule"><div class="plans" id="plans"></div></section>
  <section class="view" id="view-heizung"><div id="heatWrap" style="height:100%"></div></section>

  <div class="demo" id="demo"></div>
  <div class="status" id="status"></div>
</main>

<nav>
  <button data-view="start" class="active"><span class="ni">🏠</span>Heute</button>
  <button data-view="kalender"><span class="ni">📅</span>Woche</button>
  <button data-view="schule"><span class="ni">🎒</span>Schule</button>
  <button data-view="heizung"><span class="ni">🔥</span>Heizung</button>
</nav>

<div id="night">
  <div class="clock" id="nclock">--:--</div>
  <div class="date" id="ndate"></div>
  <div class="nw" id="nweather"></div>
</div>

<script>
/* =====================================================================
   EINSTELLUNGEN – hier anpassen
   ===================================================================== */
var CONFIG = {
  ort: 'Magdeburg',
  lat: 52.1205,
  lon: 11.6276,

  // URL der Apps-Script-Web-App (kalender.gs) – leer = Demo-Termine
  kalenderApi: '',
  token: '',              // muss zum TOKEN im Apps Script passen

  // URL deines bestehenden Heizungs-Dashboards (GitHub-Seite)
  heizungUrl: '',

  tageVoraus: 7,          // so viele Tage zeigt die Terminliste
  schuleMorgenAb: 14,     // ab dieser Uhrzeit zeigt die Schultafel schon den nächsten Schultag
  nichtInKachel: ['Mittagessen'],   // diese Einträge stehen nur im Wochenplan, nicht auf der Startseite
  nachtVon: 23,           // Nachtmodus (dunkler Bildschirm, Uhr gedimmt)
  nachtBis: 6,
  zurueckZumStartNachMin: 3,  // ohne Berührung zurück zur Startseite

  // Fächerfarben wie auf der Magnettafel: [Teil des Fachnamens, Hintergrund, Schrift]
  fachFarben: [
    ['Mathe',       '#232a4a', '#ffffff'],
    ['Deutsch',     '#f0683a', '#ffffff'],
    ['Sport',       '#2f5f9e', '#ffffff'],
    ['Kunst',       '#ef8f97', '#2a1416'],
    ['Sachkunde',   '#1d6b46', '#ffffff'],
    ['Musik',       '#f4c544', '#2b2208'],
    ['Religion',    '#aaa3d8', '#1c1838'],
    ['Betreuung',   '#e6e9f0', '#1d2433'],
    ['Mittagessen', '#5fb59b', '#0f2a22'],
    ['AG',          '#f6c1a4', '#3a1d10'],
    ['Englisch',    '#6c8fb8', '#ffffff'],
    ['Kita',        '#9fd17a', '#16300b']
  ],
  fachFarbeSonst: ['#c9d3df', '#1b2433']
};
/* ===================================================================== */

var TAGE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var TAGE_K = ['So','Mo','Di','Mi','Do','Fr','Sa'];
var MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

var WMO = {
  0:['☀️','Klar'],1:['🌤️','Überwiegend klar'],2:['⛅','Teilweise bewölkt'],3:['☁️','Bedeckt'],
  45:['🌫️','Nebel'],48:['🌫️','Reifnebel'],
  51:['🌦️','Leichter Niesel'],53:['🌦️','Niesel'],55:['🌧️','Starker Niesel'],
  56:['🌧️','Gefrierender Niesel'],57:['🌧️','Gefrierender Niesel'],
  61:['🌦️','Leichter Regen'],63:['🌧️','Regen'],65:['🌧️','Starker Regen'],
  66:['🌧️','Gefrierender Regen'],67:['🌧️','Gefrierender Regen'],
  71:['🌨️','Leichter Schnee'],73:['🌨️','Schnee'],75:['❄️','Starker Schnee'],77:['🌨️','Schneegriesel'],
  80:['🌦️','Regenschauer'],81:['🌧️','Schauer'],82:['⛈️','Heftige Schauer'],
  85:['🌨️','Schneeschauer'],86:['🌨️','Starke Schneeschauer'],
  95:['⛈️','Gewitter'],96:['⛈️','Gewitter mit Hagel'],99:['⛈️','Schweres Gewitter']
};

var state = { weather:null, cal:null, calError:false, weatherError:false, wakeUntil:0, lastTouch:Date.now(), heatLoaded:false };

function $(id){ return document.getElementById(id); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function hm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function midnight(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function wmo(code, isDay){
  var w = WMO[code] || ['❔','–'];
  if (isDay === 0 && (code === 0 || code === 1)) return ['🌙', w[1]];
  return w;
}
function dayLabel(d){
  var t = midnight(new Date()), diff = Math.round((midnight(d) - t) / 86400000);
  if (diff === 0) return 'Heute';
  if (diff === 1) return 'Morgen';
  return TAGE[d.getDay()] + ', ' + d.getDate() + '. ' + MONATE[d.getMonth()];
}

/* ---------------- Zwischenspeicher (letzte Daten bei WLAN-Ausfall) ---------------- */
function saveCache(key, val){ try { localStorage.setItem('hz_' + key, JSON.stringify({t: Date.now(), v: val})); } catch (e) {} }
function readCache(key){ try { var x = JSON.parse(localStorage.getItem('hz_' + key)); return x || null; } catch (e) { return null; } }

/* ---------------- Uhr & Nachtmodus ---------------- */
function tick(){
  var n = new Date();
  var dateTxt = TAGE[n.getDay()] + ', ' + n.getDate() + '. ' + MONATE[n.getMonth()];
  $('clock').textContent = hm(n);  $('nclock').textContent = hm(n);
  $('date').textContent = dateTxt; $('ndate').textContent = dateTxt;

  var h = n.getHours();
  var nachts = CONFIG.nachtVon > CONFIG.nachtBis ? (h >= CONFIG.nachtVon || h < CONFIG.nachtBis)
                                                 : (h >= CONFIG.nachtVon && h < CONFIG.nachtBis);
  $('night').className = (nachts && Date.now() > state.wakeUntil) ? 'on' : '';

  if (Date.now() - state.lastTouch > CONFIG.zurueckZumStartNachMin * 60000) {
    var active = document.querySelector('nav button.active');
    if (active && active.getAttribute('data-view') !== 'start') showView('start');
  }
}
$('night').addEventListener('click', function(){ state.wakeUntil = Date.now() + 2 * 60000; tick(); });
document.addEventListener('touchstart', function(){ state.lastTouch = Date.now(); }, {passive:true});
document.addEventListener('mousedown', function(){ state.lastTouch = Date.now(); });

/* ---------------- Navigation ---------------- */
function showView(name){
  var btns = document.querySelectorAll('nav button');
  for (var i = 0; i < btns.length; i++) btns[i].className = btns[i].getAttribute('data-view') === name ? 'active' : '';
  var views = document.querySelectorAll('.view');
  for (var j = 0; j < views.length; j++) views[j].className = 'view' + (views[j].id === 'view-' + name ? ' active' : '');
  if (name === 'heizung') loadHeat();
}
var navBtns = document.querySelectorAll('nav button');
for (var b = 0; b < navBtns.length; b++) {
  navBtns[b].addEventListener('click', function(){ showView(this.getAttribute('data-view')); });
}
$('schoolTile').addEventListener('click', function(){ showView('schule'); });
$('schoolTile').addEventListener('keydown', function(e){ if (e.key === 'Enter') showView('schule'); });

/* ---------------- Heizung ---------------- */
function loadHeat(){
  if (state.heatLoaded) return;
  var wrap = $('heatWrap');
  if (!CONFIG.heizungUrl) {
    wrap.innerHTML = '<div class="notice">Hier erscheint dein Heizungs-Dashboard. ' +
      'Trag dafür oben im Code bei <code>heizungUrl</code> die Adresse deiner Heizungsseite ein.</div>';
    return;
  }
  wrap.innerHTML = '<iframe class="frame" src="' + esc(CONFIG.heizungUrl) + '"></iframe>';
  state.heatLoaded = true;
}

/* ---------------- Wetter (Open-Meteo, kein API-Key nötig) ---------------- */
function loadWeather(){
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day' +
    '&hourly=temperature_2m,precipitation_probability,weather_code,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset' +
    '&timezone=Europe%2FBerlin&forecast_days=6';
  fetch(url).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ state.weather = d; state.weatherError = false; state.weatherTime = new Date(); saveCache('weather', d); renderWeather(); renderStatus(); })
    .catch(function(){ state.weatherError = true; if (!state.weather) renderWeather(); renderStatus(); });
}

function renderWeather(){
  var d = state.weather;
  if (!d) { $('nowWeather').innerHTML = '<div class="sub">Wetter nicht erreichbar</div>'; return; }
  var c = d.current, w = wmo(c.weather_code, c.is_day), t = Math.round(c.temperature_2m);

  var nowKey = c.time.substring(0, 13), start = 0;
  for (var i = 0; i < d.hourly.time.length; i++) { if (d.hourly.time[i].substring(0, 13) === nowKey) { start = i; break; } }

  // nur der heutige Tag: Regen bis Mitternacht, Frost bis morgen früh
  var todayKey = c.time.substring(0, 10), rainAt = null, minNext = 99;
  for (var k = start; k < d.hourly.time.length && d.hourly.time[k].substring(0, 10) === todayKey; k++) {
    if (d.hourly.precipitation_probability[k] >= 50) { rainAt = parseInt(d.hourly.time[k].substring(11, 13), 10); break; }
  }
  for (var f = start; f < start + 18 && f < d.hourly.time.length; f++) minNext = Math.min(minNext, d.hourly.temperature_2m[f]);
  var say = esc(w[1]);
  if (rainAt !== null) say += (rainAt === new Date().getHours() ? ', <b>jetzt Regen</b>' : ', <b>ab ' + rainAt + ' Uhr Regen</b>');
  else say += ', heute trocken';
  if (minNext <= 1) say += ', <b>Frost möglich</b>';

  $('nowWeather').innerHTML =
    '<div class="row"><div class="ico">' + w[0] + '</div><div class="t">' + t + '°</div>' +
    '<div class="mx">' + Math.round(d.daily.temperature_2m_max[0]) + '° / ' + Math.round(d.daily.temperature_2m_min[0]) + '°</div></div>' +
    '<div class="say">' + say + '</div>';
  $('nweather').textContent = t + '°, ' + w[1];
}

/* ---------------- Kalender ---------------- */
function loadCalendar(){
  if (!CONFIG.kalenderApi) { state.cal = demoData(); state.isDemo = true; renderCalendar(); renderStatus(); return; }
  var url = CONFIG.kalenderApi + (CONFIG.kalenderApi.indexOf('?') < 0 ? '?' : '&') +
    'days=' + CONFIG.tageVoraus + '&token=' + encodeURIComponent(CONFIG.token) + '&t=' + Date.now();
  fetch(url).then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      state.cal = d; state.isDemo = false; state.calError = false; state.calTime = new Date();
      saveCache('cal', d);
      renderCalendar(); renderStatus();
    })
    .catch(function(){ state.calError = true; if (!state.cal) renderCalendar(); renderStatus(); });
}

function eventsForDay(day){
  var ds = midnight(day), de = addDays(ds, 1), out = [];
  var evs = (state.cal && state.cal.events) || [];
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i], s = new Date(e.start), en = new Date(e.end);
    if (s < de && en > ds) out.push({ e:e, s:s, en:en });
  }
  out.sort(function(a, b){
    if (a.e.allDay !== b.e.allDay) return a.e.allDay ? -1 : 1;
    return a.s - b.s;
  });
  return out;
}

function evState(x, now){
  if (x.e.allDay) return '';
  if (x.en < now) return ' past';
  if (x.s <= now && x.en > now) return ' now';
  return '';
}

function agendaRow(x, now){
  var e = x.e, cls = 'ev' + (e.allDay ? ' allday' : '') + evState(x, now);
  var tm = e.allDay ? 'ganztags' : hm(x.s) + '<span>bis ' + hm(x.en) + '</span>';
  var meta = [];
  if (e.calendar && state.cal.calendars && state.cal.calendars.length > 1) meta.push(esc(e.calendar));
  if (e.location) meta.push(esc(e.location));
  return '<div class="' + cls + '"><div class="tm">' + tm + '</div><div class="bar" style="background:' + esc(e.color || '#8fd0ff') + '"></div>' +
    '<div><div class="ti">' + esc(e.title || '(ohne Titel)') + '</div>' + (meta.length ? '<div class="me">' + meta.join(', ') + '</div>' : '') + '</div></div>';
}

function renderCalendar(){
  var now = new Date(), today = midnight(now);
  if (!state.cal) {
    $('agenda').innerHTML = '<h2>Termine</h2><div class="empty" style="padding-left:0">Kalender nicht erreichbar. Prüf das WLAN; die Seite versucht es alle 5 Minuten neu.</div>';
    return;
  }

  // Heute groß
  var evs0 = eventsForDay(today), html = '';
  for (var k = 0; k < evs0.length; k++) html += agendaRow(evs0[k], now);
  if (!evs0.length) html = '<div class="empty" style="padding-left:0">Heute steht nichts an.</div>';
  $('agenda').innerHTML = html;

  // Die nächsten 6 Tage als Spalten
  var ws = '';
  for (var n = 1; n <= 6; n++) {
    var sd = addDays(today, n), sevs = eventsForDay(sd);
    ws += '<div class="wcol"><div class="wh"><b>' + (n === 1 ? 'Morgen' : TAGE[sd.getDay()]) + '</b><span>' + sd.getDate() + '. ' + MONATE[sd.getMonth()].substring(0, 3) + '</span></div>';
    if (!sevs.length) ws += '<div class="wempty">frei</div>';
    for (var m2 = 0; m2 < sevs.length; m2++) {
      var y = sevs[m2];
      ws += '<div class="wev" style="border-color:' + esc(y.e.color || '#8fd0ff') + '"><div class="tm">' +
        (y.e.allDay ? 'ganztags' : hm(y.s)) + '</div><div class="ti">' + esc(y.e.title || '(ohne Titel)') + '</div></div>';
    }
    ws += '</div>';
  }
  $('weekStrip').innerHTML = ws;

  var cals = state.cal.calendars || [], lg = '';
  if (cals.length > 1) for (var c = 0; c < cals.length; c++) lg += '<i style="background:' + esc(cals[c].color) + '"></i>' + esc(cals[c].name);
  $('legend').innerHTML = lg;

  var wk = '';
  for (var d = 0; d < 7; d++) {
    var wd = addDays(today, d), wevs = eventsForDay(wd);
    wk += '<div class="wcol' + (d === 0 ? ' today' : '') + '"><div class="wh"><b>' + (d === 0 ? 'Heute' : TAGE[wd.getDay()]) +
      '</b><span>' + wd.getDate() + '. ' + MONATE[wd.getMonth()] + '</span></div>';
    if (!wevs.length) wk += '<div class="wempty">frei</div>';
    for (var m = 0; m < wevs.length; m++) {
      var x = wevs[m];
      wk += '<div class="wev' + evState(x, now) + '" style="border-color:' + esc(x.e.color || '#8fd0ff') + '"><div class="tm">' +
        (x.e.allDay ? 'ganztags' : hm(x.s)) + '</div><div class="ti">' + esc(x.e.title || '(ohne Titel)') + '</div></div>';
    }
    wk += '</div>';
  }
  $('week').innerHTML = wk;

  renderSchool();
}

/* ---------------- Stundenplan ---------------- */
var TAGE_KURZ_SCHULE = ['Mo','Di','Mi','Do','Fr'];

function farbe(fach){
  var f = String(fach || '').toLowerCase();
  for (var i = 0; i < CONFIG.fachFarben.length; i++) {
    if (f.indexOf(CONFIG.fachFarben[i][0].toLowerCase()) >= 0) return CONFIG.fachFarben[i];
  }
  return [null, CONFIG.fachFarbeSonst[0], CONFIG.fachFarbeSonst[1]];
}
function mag(fach, extra){
  var c = farbe(fach);
  return '<span class="mag" style="background:' + c[1] + ';color:' + c[2] + '">' + esc(fach) + (extra ? '<em>' + extra + '</em>' : '') + '</span>';
}
// "Judo 14:15-15:30" → Name + Zeit getrennt
function splitTime(txt){
  var m = String(txt).match(/^(.*?)\s*(\d{1,2}[:.]\d{2})\s*[-–]\s*(\d{1,2}[:.]\d{2})\s*$/);
  return m ? { name: m[1], von: m[2], bis: m[3] } : { name: txt, von: '', bis: '' };
}

function schoolDay(){
  var n = new Date(), d = midnight(n), wd = n.getDay();
  if (wd >= 1 && wd <= 5 && n.getHours() < CONFIG.schuleMorgenAb) return d;
  do { d = addDays(d, 1); } while (d.getDay() === 0 || d.getDay() === 6);
  return d;
}
// kita = true: Schulferien zählen nicht, nur Feiertage
function freeDayReason(day, kita){
  var evs = eventsForDay(day);
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i].e;
    if (!e.allDay) continue;
    if (/feiertag/i.test(e.calendar || '')) return e.title;
    if (!kita && (/ferien/i.test(e.title || '') || /ferien/i.test(e.calendar || ''))) return e.title;
  }
  return '';
}
function lessonsOf(kind, idx){
  var out = [];
  for (var i = 0; i < kind.rows.length; i++) {
    var f = kind.rows[i].tage[idx];
    if (f) out.push({ stunde: kind.rows[i].stunde, zeit: kind.rows[i].zeit, fach: f });
  }
  return out;
}
function bringFor(lessons, hinweise){
  var out = [], seen = {};
  for (var key in hinweise) {
    if (!hinweise.hasOwnProperty(key)) continue;
    for (var i = 0; i < lessons.length; i++) {
      if (lessons[i].fach.toLowerCase().indexOf(key.toLowerCase()) >= 0 && !seen[key]) { seen[key] = 1; out.push(hinweise[key]); }
    }
  }
  return out;
}

function renderSchool(){
  var tile = $('schoolTile');
  var sp = state.cal && state.cal.stundenplan;
  if (!sp || !sp.kinder || !sp.kinder.length) {
    tile.style.display = 'none';
    $('plans').innerHTML = '<div class="notice">Noch kein Stundenplan. Führ im Apps Script die Funktion <code>einrichten</code> aus und füll die Tabelle aus.</div>';
    return;
  }
  tile.style.display = '';

  var day = schoolDay(), idx = day.getDay() - 1;
  var when = dayLabel(day);
  if (when.indexOf(',') > 0) when = TAGE[day.getDay()];
  var html = '';
  for (var k = 0; k < sp.kinder.length; k++) {
    var kind = sp.kinder[k], ls = lessonsOf(kind, idx);
    var school = [], after = [], ende = '', kita = false;
    for (var q = 0; q < ls.length; q++) if (/^kita/i.test(ls[q].fach)) kita = true;
    var free = freeDayReason(day, kita);
    for (var i = 0; i < ls.length; i++) {
      if (!ls[i].zeit) { after.push(ls[i].fach); continue; }
      if (ls[i].zeit.indexOf('-') > 0) ende = ls[i].zeit.split('-')[1].trim();
      if (CONFIG.nichtInKachel.indexOf(ls[i].fach) >= 0) continue;
      var last = school[school.length - 1];
      if (last && last.fach === ls[i].fach) last.n++; else school.push({ fach: ls[i].fach, n: 1 });
    }
    var head = when + (free ? ' frei' : (ende ? (kita ? ', abholen ' : ', Schluss ') + ende : ''));
    html += '<div class="kidc"><div class="kid-head"><span class="kid-name">' + esc(kind.name) + '</span><span class="kid-when">' + esc(head) + '</span></div>';
    if (free) { html += '<div class="free">' + esc(free) + '</div></div>'; continue; }
    if (!school.length && !after.length) { html += '<div class="free">Kein Unterricht eingetragen</div></div>'; continue; }
    html += '<div class="mags">';
    for (var s = 0; s < school.length; s++) html += mag(school[s].fach, school[s].n > 1 ? school[s].n + ' Std.' : '');
    for (var a = 0; a < after.length; a++) {
      var st = splitTime(after[a]);
      html += '<span class="mag after">' + esc(st.name) + (st.von ? '<em>' + esc(st.von) + '</em>' : '') + '</span>';
    }
    html += '</div>';
    var bring = bringFor(ls, sp.hinweise || {});
    if (bring.length) html += '<div class="bring">Einpacken: ' + esc(bring.join(', ')) + '</div>';
    html += '</div>';
  }
  tile.innerHTML = html;

  // Ansicht "Schule": die ganze Magnettafel
  var ph = '';
  for (var p = 0; p < sp.kinder.length; p++) {
    var kd = sp.kinder[p];
    ph += '<div class="plan"><h2>' + esc(kd.name) + '<small>Stundenplan</small></h2><table><tr><th></th>';
    for (var t = 0; t < 5; t++) ph += '<th' + (t === idx ? ' class="hl"' : '') + '>' + TAGE[t + 1] + '</th>';
    ph += '</tr>';
    for (var r = 0; r < kd.rows.length; r++) {
      var row = kd.rows[r], isNum = /^\d+$/.test(row.stunde);
      var label = row.zeit ? '<b>' + esc(row.zeit.replace('-', '–')) + '</b>' + (isNum ? esc(row.stunde) + '. Stunde' : esc(row.stunde))
                           : '<b>Nachmittag</b>';
      ph += '<tr><td class="n">' + label + '</td>';
      for (var c = 0; c < 5; c++) {
        var f = row.tage[c], hl = c === idx ? ' hl' : '';
        if (!f) { ph += '<td class="e' + hl + '"></td>'; continue; }
        if (!row.zeit) {
          var stt = splitTime(f);
          ph += '<td class="' + hl + '"><span class="mag after">' + esc(stt.name) + (stt.von ? '<em>' + esc(stt.von) + '–' + esc(stt.bis) + '</em>' : '') + '</span></td>';
        } else {
          ph += '<td class="' + hl + '">' + mag(f) + '</td>';
        }
      }
      ph += '</tr>';
    }
    ph += '</table></div>';
  }
  $('plans').innerHTML = ph;
}

/* Demo-Daten, solange keine Kalender-URL eingetragen ist */
function demoData(){
  var t = midnight(new Date());
  function at(day, h, m, dur){ var s = addDays(t, day); s.setHours(h, m, 0, 0); return [s.toISOString(), new Date(s.getTime() + dur * 60000).toISOString()]; }
  function allDay(day, days){ return [addDays(t, day).toISOString(), addDays(t, day + (days || 1)).toISOString()]; }
  function ev(title, r, ad, loc){ return { title:title, start:r[0], end:r[1], allDay:!!ad, calendar:'Kalender', color:'#8fd0ff', location:loc || '' }; }
  return {
    calendars: [ {name:'Kalender', color:'#8fd0ff'} ],
    events: [
      ev('Gelbe Tonne rausstellen', allDay(0), true),
      ev('Einkaufen', at(0, 10, 0, 60)),
      ev('Kindergeburtstag', at(0, 15, 0, 150), false, 'Spielplatz Stadtpark'),
      ev('Zahnarzt', at(1, 8, 30, 45)),
      ev('Bürdemessung UW', at(1, 9, 30, 180)),
      ev('Elternabend', at(3, 19, 0, 90), false, 'Grundschule'),
      ev('Grillen bei Freunden', at(5, 17, 0, 240))
    ],
    stundenplan: {
      kinder: [
        { name: 'Ilse', rows: [
          { stunde:'1', zeit:'08:00-08:45', tage:['Mathe','Mathe','Betreuung','Betreuung','Sport'] },
          { stunde:'2', zeit:'09:00-09:45', tage:['Mathe','Mathe','Mathe','Religion','Sport'] },
          { stunde:'3', zeit:'10:05-10:50', tage:['Deutsch','Deutsch','Deutsch','Mathe','Kunst'] },
          { stunde:'4', zeit:'10:55-11:40', tage:['Deutsch','AG','Deutsch','Deutsch','Kunst'] },
          { stunde:'5', zeit:'11:40-12:15', tage:['Mittagessen','Mittagessen','Mittagessen','Mittagessen','Mittagessen'] },
          { stunde:'6', zeit:'12:15-13:00', tage:['Sachkunde','Kunst','Musik','Sachkunde','Betreuung'] },
          { stunde:'7', zeit:'13:00-13:45', tage:['','','Sachkunde','',''] },
          { stunde:'Nachm.', zeit:'', tage:['Judo 14:15-15:30','Schachzwerge 13:15-14:00','','Kinderyoga 14:00-15:00',''] },
          { stunde:'Nachm.', zeit:'', tage:['','','','Tanzen 16:00-17:00',''] }
        ]},
        { name: 'Jutta', rows: [
          { stunde:'Kita', zeit:'07:30-15:30', tage:['Kita','Kita','Kita','Kita','Kita'] },
          { stunde:'Extra', zeit:'', tage:['','Turnen','','Waldtag',''] }
        ]}
      ],
      hinweise: { 'Sport':'Sportzeug', 'Judo':'Judoanzug', 'Tanzen':'Tanzsachen', 'Kunst':'Kunstsachen', 'Turnen':'Turnbeutel', 'Wald':'Matschhose und Gummistiefel' }
    }
  };
}

/* ---------------- Statuszeile ---------------- */
function renderStatus(){
  var s = [];
  if (state.weatherTime) s.push('Wetter ' + hm(state.weatherTime) + (state.weatherError ? ' (alt)' : ''));
  if (state.calTime) s.push('Kalender ' + hm(state.calTime) + (state.calError ? ' (alt)' : ''));
  else if (state.calError) s.push('Kalender nicht erreichbar');
  $('status').textContent = s.length ? 'Stand: ' + s.join(', ') : '';
  $('demo').textContent = state.isDemo ? 'Beispieldaten – trag oben im Code bei kalenderApi deine Script-Adresse ein' : '';
}

/* ---------------- Start ---------------- */
tick();
(function(){
  var w = readCache('weather');
  if (w && w.v) { state.weather = w.v; state.weatherTime = new Date(w.t); renderWeather(); }
  var c = readCache('cal');
  if (c && c.v && CONFIG.kalenderApi) { state.cal = c.v; state.calTime = new Date(c.t); renderCalendar(); }
  renderStatus();
})();
loadWeather();
loadCalendar();
setInterval(tick, 1000);
setInterval(loadWeather, 15 * 60000);
setInterval(loadCalendar, 5 * 60000);
setInterval(function(){ if (state.cal) renderCalendar(); }, 60000);
setTimeout(function(){ location.reload(); }, 6 * 3600000);
</script>
