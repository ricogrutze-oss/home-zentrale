<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home-Zentrale</title>
<style>
/* ======= Farben & Grundlayout (dunkel, gut lesbar an der Wand) ======= */
:root{
  --bg:#0e1318; --card:#18202a; --card2:#202a36; --line:#2a3644;
  --text:#e9eef3; --muted:#8d9aa8; --accent:#4f9cf7; --warn:#f5a524; --cold:#7cc4ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;overflow:hidden}
body{display:flex;flex-direction:column}

/* Kopfzeile */
header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px}
.clock{font-size:64px;font-weight:300;letter-spacing:1px;line-height:1}
.date{font-size:20px;color:var(--muted);margin-top:4px}
.head-weather{display:flex;align-items:center;text-align:right}
.head-weather .ico{font-size:48px;margin-right:12px}
.head-weather .t{font-size:44px;font-weight:300}
.head-weather .d{font-size:15px;color:var(--muted)}

/* Hauptbereich */
main{flex:1;min-height:0;padding:8px 20px 12px;position:relative}
.view{display:none;height:100%}
.view.active{display:block}
.card{background:var(--card);border-radius:18px;padding:16px 18px;overflow:hidden}
.card h2{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:10px}

/* Startansicht */
.start{display:grid;grid-template-columns:1.25fr 1fr;grid-gap:16px;height:100%}
.right{display:grid;grid-template-rows:auto auto auto;grid-gap:16px;min-height:0;overflow-y:auto;align-content:start}
.agenda{overflow-y:auto;-webkit-overflow-scrolling:touch}
.right .card{overflow:visible}
.left{display:grid;grid-template-rows:auto 1fr;grid-gap:16px;min-height:0}
.left .school{overflow:visible}
.school .kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));grid-gap:4px 20px}
.school h2{margin-bottom:2px}
#heatTile{display:none}  /* Heizung ist über die Leiste unten erreichbar; bei Bedarf wieder einblenden */

/* Termine */
.day{margin-bottom:14px}
.day-label{font-size:17px;font-weight:600;margin-bottom:6px;color:var(--accent)}
.day-label.other{color:var(--text)}
.ev{display:flex;align-items:stretch;background:var(--card2);border-radius:12px;margin-bottom:6px;overflow:hidden}
.ev .bar{width:6px;flex-shrink:0}
.ev .body{padding:8px 12px;flex:1;min-width:0}
.ev .time{font-size:14px;color:var(--muted)}
.ev .title{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.past{opacity:.45}
.ev.now{box-shadow:inset 0 0 0 2px var(--accent)}
.empty{color:var(--muted);font-size:16px;padding:4px 0 8px}
.legend{margin-top:4px}
.chip{display:inline-block;font-size:13px;color:var(--muted);margin:0 12px 6px 0}
.chip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* Wetter */
.w-now{display:flex;align-items:center;margin-bottom:6px}
.w-now .ico{font-size:64px;margin-right:14px;line-height:1}
.w-now .t{font-size:52px;font-weight:300;line-height:1}
.w-now .desc{font-size:18px}
.w-now .sub{font-size:14px;color:var(--muted);margin-top:2px}
.hints{margin:8px 0 10px}
.hint{font-size:15px;background:var(--card2);border-radius:10px;padding:7px 10px;margin-bottom:6px}
.hint.warn{border-left:4px solid var(--warn)}
.hint.cold{border-left:4px solid var(--cold)}
.hourly{display:grid;grid-template-columns:repeat(8,1fr);grid-gap:4px;text-align:center;margin-bottom:12px}
.hourly div{background:var(--card2);border-radius:10px;padding:6px 0}
.hourly .h{font-size:13px;color:var(--muted)}
.hourly .i{font-size:22px;margin:2px 0}
.hourly .v{font-size:15px}
.hourly .p{font-size:11px;color:var(--cold);height:13px}
.daily{display:grid;grid-template-columns:repeat(5,1fr);grid-gap:4px;text-align:center}
.daily div{padding:4px 0}
.daily .n{font-size:14px;color:var(--muted)}
.daily .i{font-size:26px;margin:2px 0}
.daily .mm{font-size:15px}
.daily .mm span{color:var(--muted)}
.daily .p{font-size:12px;color:var(--cold)}
.sun{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}

/* Heizungs-Kachel */
.tile{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.tile .big{font-size:24px}
.tile .small{font-size:14px;color:var(--muted);margin-top:2px}
.tile .arrow{font-size:32px;color:var(--muted)}
.tile:active{background:var(--card2)}

/* Schule (Kachel auf Start) */
.school .who{font-size:16px;font-weight:600;margin-top:6px}
.school .subj{font-size:15px;margin-top:1px}
.school .until{font-size:13px;color:var(--muted)}
.school .bring{display:inline-block;font-size:13px;background:var(--card2);border-left:3px solid var(--warn);border-radius:6px;padding:2px 8px;margin:4px 6px 0 0}
.school .free{font-size:16px;color:var(--muted);margin-top:4px}

/* Schule (Ansicht) */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));grid-gap:16px;height:100%;overflow-y:auto}
.plan table{width:100%;border-collapse:separate;border-spacing:3px;font-size:15px}
.plan th{color:var(--muted);font-weight:600;padding:6px 4px;font-size:14px}
.plan th.hl{color:var(--accent)}
.plan td{background:var(--card2);border-radius:8px;padding:8px 6px;text-align:center}
.plan td.n{background:none;color:var(--muted);font-size:13px;text-align:left;white-space:nowrap}
.plan td.hl{box-shadow:inset 0 0 0 2px var(--accent)}
.plan td.e{background:none}

/* Wochenansicht */
.week{display:grid;grid-template-columns:repeat(7,1fr);grid-gap:8px;height:100%}
.wcol{background:var(--card);border-radius:14px;padding:10px 8px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wcol.today{box-shadow:inset 0 0 0 2px var(--accent)}
.wcol .wh{text-align:center;margin-bottom:8px}
.wcol .wh b{display:block;font-size:16px}
.wcol .wh span{font-size:13px;color:var(--muted)}
.wcol .ev .title{font-size:15px;white-space:normal}
.wcol .ev .body{padding:6px 8px}
.wcol .ev .time{font-size:12px}

/* Heizung (eingebettet) */
.frame{width:100%;height:100%;border:0;border-radius:14px;background:#fff}
.notice{padding:30px;text-align:center;color:var(--muted);font-size:17px;line-height:1.6}
.notice code{color:var(--text);background:var(--card2);padding:2px 6px;border-radius:6px}

/* Navigation unten */
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--card)}
nav button{background:none;border:0;color:var(--muted);font-size:18px;padding:14px 0 16px;font-family:inherit;cursor:pointer}
nav button.active{color:var(--accent)}
nav button .ni{display:block;font-size:24px;margin-bottom:2px}

/* Statuszeile & Demo-Hinweis */
.status{position:absolute;right:26px;bottom:16px;font-size:11px;color:var(--muted);opacity:.7}
.demo{position:absolute;left:26px;bottom:16px;font-size:12px;color:var(--warn)}

/* Nachtmodus */
#night{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:10;
  flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#night.on{display:flex}
#night .clock{font-size:120px;color:#3a4552}
#night .date{color:#2a333d;font-size:22px}
#night .nw{color:#2a333d;font-size:22px;margin-top:10px}

/* Schmale Bildschirme (Handy-Vorschau / Hochformat) */
@media (max-width:820px){
  header{padding:10px 14px 6px}
  .clock{font-size:46px}
  .head-weather .ico{font-size:36px}
  .head-weather .t{font-size:32px}
  main{padding:6px 12px 10px;overflow-y:auto}
  .start{grid-template-columns:1fr;height:auto}
  .right{grid-template-rows:auto auto}
  .agenda{max-height:none}
  .week{grid-template-columns:1fr;height:auto}
  .view.active{height:auto}
  #view-heizung.active{height:100%}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>
  <div class="head-weather" id="headWeather"></div>
</header>

<main>
  <!-- START -->
  <section class="view active" id="view-start">
    <div class="start">
      <div class="left">
        <div class="card school" id="schoolTile" style="cursor:pointer"><h2>Schule</h2><div class="empty">Lade Stundenplan …</div></div>
        <div class="card agenda">
          <h2>Termine</h2>
          <div id="agenda"><div class="empty">Lade Termine …</div></div>
          <div class="legend" id="legend"></div>
        </div>
      </div>
      <div class="right">
        <div class="card" id="weatherCard"><h2>Wetter</h2><div class="empty">Lade Wetter …</div></div>
        <div class="card tile" id="heatTile">
          <div>
            <div class="big">🔥 Heizung</div>
            <div class="small" id="heatSmall">Übersicht öffnen</div>
          </div>
          <div class="arrow">›</div>
        </div>
      </div>
    </div>
  </section>

  <!-- KALENDER -->
  <section class="view" id="view-kalender">
    <div class="week" id="week"></div>
  </section>

  <!-- SCHULE -->
  <section class="view" id="view-schule">
    <div class="plans" id="plans"></div>
  </section>

  <!-- HEIZUNG -->
  <section class="view" id="view-heizung">
    <div id="heatWrap" style="height:100%"></div>
  </section>

  <div class="demo" id="demo"></div>
  <div class="status" id="status"></div>
</main>

<nav>
  <button data-view="start" class="active"><span class="ni">🏠</span>Start</button>
  <button data-view="kalender"><span class="ni">📅</span>Woche</button>
  <button data-view="schule"><span class="ni">🎒</span>Schule</button>
  <button data-view="heizung"><span class="ni">🔥</span>Heizung</button>
</nav>

<div id="night">
  <div class="clock" id="nclock">--:--</div>
  <div class="date" id="ndate"></div>
  <div class="nw" id="nweather"></div>
</div>

<script>
/* =====================================================================
   EINSTELLUNGEN – hier anpassen
   ===================================================================== */
var CONFIG = {
  ort: 'Magdeburg',
  lat: 52.1205,
  lon: 11.6276,

  // URL der Apps-Script-Web-App (kalender.gs) – leer = Demo-Termine
  kalenderApi: 'https://script.google.com/macros/s/AKfycbwaecHtqf79uiJ8UjZ5XR6zbfOtwPqfi6BZpjAfjq3MLWQw3TPFm9cqVD-LbebygNol/exec',
  token: 'harnack-kalender-73',              // muss zum TOKEN im Apps Script passen

  // URL deines bestehenden Heizungs-Dashboards (GitHub-Seite)
  heizungUrl: 'https://ricogrutze-oss.github.io/heizung/',

  tageVoraus: 7,          // so viele Tage zeigt die Terminliste
  schuleMorgenAb: 14,     // ab dieser Uhrzeit zeigt die Schul-Kachel schon den nächsten Schultag
  nichtInKachel: ['Mittagessen'],   // diese Einträge stehen nur im Wochenplan, nicht in der Kachel
  nachtVon: 23,           // Nachtmodus (schwarzer Bildschirm, Uhr gedimmt)
  nachtBis: 6,
  zurueckZumStartNachMin: 3   // ohne Berührung zurück zur Startseite
};
/* ===================================================================== */

var TAGE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var TAGE_K = ['So','Mo','Di','Mi','Do','Fr','Sa'];
var MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

var WMO = {
  0:['☀️','Klar'],1:['🌤️','Überwiegend klar'],2:['⛅','Teilweise bewölkt'],3:['☁️','Bedeckt'],
  45:['🌫️','Nebel'],48:['🌫️','Reifnebel'],
  51:['🌦️','Leichter Niesel'],53:['🌦️','Niesel'],55:['🌧️','Starker Niesel'],
  56:['🌧️','Gefrierender Niesel'],57:['🌧️','Gefrierender Niesel'],
  61:['🌦️','Leichter Regen'],63:['🌧️','Regen'],65:['🌧️','Starker Regen'],
  66:['🌧️','Gefrierender Regen'],67:['🌧️','Gefrierender Regen'],
  71:['🌨️','Leichter Schnee'],73:['🌨️','Schnee'],75:['❄️','Starker Schnee'],77:['🌨️','Schneegriesel'],
  80:['🌦️','Regenschauer'],81:['🌧️','Schauer'],82:['⛈️','Heftige Schauer'],
  85:['🌨️','Schneeschauer'],86:['🌨️','Starke Schneeschauer'],
  95:['⛈️','Gewitter'],96:['⛈️','Gewitter mit Hagel'],99:['⛈️','Schweres Gewitter']
};

var state = { weather:null, cal:null, calError:false, weatherError:false, wakeUntil:0, lastTouch:Date.now(), heatLoaded:false };

function $(id){ return document.getElementById(id); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function hm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function midnight(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function wmo(code, isDay){
  var w = WMO[code] || ['❔','–'];
  if (isDay === 0 && (code === 0 || code === 1)) return ['🌙', w[1]];
  return w;
}
function dayLabel(d){
  var t = midnight(new Date()), diff = Math.round((midnight(d) - t) / 86400000);
  if (diff === 0) return 'Heute';
  if (diff === 1) return 'Morgen';
  return TAGE[d.getDay()] + ', ' + d.getDate() + '. ' + MONATE[d.getMonth()];
}

/* ---------------- Uhr & Nachtmodus ---------------- */
function tick(){
  var n = new Date();
  var dateTxt = TAGE[n.getDay()] + ', ' + n.getDate() + '. ' + MONATE[n.getMonth()] + ' ' + n.getFullYear();
  $('clock').textContent = hm(n);  $('nclock').textContent = hm(n);
  $('date').textContent = dateTxt; $('ndate').textContent = dateTxt;

  var h = n.getHours();
  var nachts = CONFIG.nachtVon > CONFIG.nachtBis ? (h >= CONFIG.nachtVon || h < CONFIG.nachtBis)
                                                 : (h >= CONFIG.nachtVon && h < CONFIG.nachtBis);
  $('night').className = (nachts && Date.now() > state.wakeUntil) ? 'on' : '';

  // nach Inaktivität zurück zur Startseite
  if (Date.now() - state.lastTouch > CONFIG.zurueckZumStartNachMin * 60000) {
    var active = document.querySelector('nav button.active');
    if (active && active.getAttribute('data-view') !== 'start') showView('start');
  }
}
$('night').addEventListener('click', function(){ state.wakeUntil = Date.now() + 2 * 60000; tick(); });
document.addEventListener('touchstart', function(){ state.lastTouch = Date.now(); }, {passive:true});
document.addEventListener('mousedown', function(){ state.lastTouch = Date.now(); });

/* ---------------- Navigation ---------------- */
function showView(name){
  var btns = document.querySelectorAll('nav button');
  for (var i = 0; i < btns.length; i++) btns[i].className = btns[i].getAttribute('data-view') === name ? 'active' : '';
  var views = document.querySelectorAll('.view');
  for (var j = 0; j < views.length; j++) views[j].className = 'view' + (views[j].id === 'view-' + name ? ' active' : '');
  if (name === 'heizung') loadHeat();
}
var navBtns = document.querySelectorAll('nav button');
for (var b = 0; b < navBtns.length; b++) {
  navBtns[b].addEventListener('click', function(){ showView(this.getAttribute('data-view')); });
}
$('heatTile').addEventListener('click', function(){ showView('heizung'); });
$('schoolTile').addEventListener('click', function(){ showView('schule'); });

/* ---------------- Zwischenspeicher (letzte Daten bei WLAN-Ausfall) ---------------- */
function saveCache(key, val){ try { localStorage.setItem('hz_' + key, JSON.stringify({t: Date.now(), v: val})); } catch (e) {} }
function readCache(key){ try { var x = JSON.parse(localStorage.getItem('hz_' + key)); return x || null; } catch (e) { return null; } }

/* ---------------- Heizung ---------------- */
function loadHeat(){
  if (state.heatLoaded) return;
  var wrap = $('heatWrap');
  if (!CONFIG.heizungUrl) {
    wrap.innerHTML = '<div class="card notice">Hier erscheint dein Heizungs-Dashboard.<br>' +
      'Trage dafür oben im Code bei <code>heizungUrl</code> die Adresse deiner Heizungs-Seite ein.</div>';
    return;
  }
  wrap.innerHTML = '<iframe class="frame" src="' + esc(CONFIG.heizungUrl) + '"></iframe>';
  state.heatLoaded = true;
}

/* ---------------- Wetter (Open-Meteo, kein API-Key nötig) ---------------- */
function loadWeather(){
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day' +
    '&hourly=temperature_2m,precipitation_probability,weather_code,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset' +
    '&timezone=Europe%2FBerlin&forecast_days=6';
  fetch(url).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ state.weather = d; state.weatherError = false; state.weatherTime = new Date(); saveCache('weather', d); renderWeather(); renderStatus(); })
    .catch(function(){ state.weatherError = true; if (!state.weather) renderWeather(); renderStatus(); });
}

function renderWeather(){
  var card = $('weatherCard');
  var d = state.weather;
  if (!d) { card.innerHTML = '<h2>Wetter</h2><div class="empty">Wetter gerade nicht erreichbar.</div>'; return; }

  var c = d.current, w = wmo(c.weather_code, c.is_day);
  var t = Math.round(c.temperature_2m);

  // Kopfzeile
  $('headWeather').innerHTML = '<div class="ico">' + w[0] + '</div><div><div class="t">' + t + '°</div><div class="d">' + esc(CONFIG.ort) + '</div></div>';
  $('nweather').textContent = t + '° · ' + w[1];
  $('heatSmall').textContent = 'Übersicht öffnen · draußen ' + t + '°';

  // Stundenwerte ab jetzt
  var nowKey = c.time.substring(0, 13), start = 0;
  for (var i = 0; i < d.hourly.time.length; i++) { if (d.hourly.time[i].substring(0, 13) === nowKey) { start = i; break; } }

  // Hinweise: Regen in den nächsten 12 h, Frost heute Nacht
  var hints = '', rainAt = null;
  for (var k = start; k < start + 12 && k < d.hourly.time.length; k++) {
    if (d.hourly.precipitation_probability[k] >= 50) { rainAt = d.hourly.time[k].substring(11, 13); break; }
  }
  if (rainAt !== null) hints += '<div class="hint warn">☔ Regen wahrscheinlich ab ' + parseInt(rainAt, 10) + ' Uhr – Schirm mitnehmen</div>';
  else hints += '<div class="hint">🌂 In den nächsten 12 Stunden kein Regen erwartet</div>';
  var minNext = 99;
  for (var f = start; f < start + 18 && f < d.hourly.time.length; f++) minNext = Math.min(minNext, d.hourly.temperature_2m[f]);
  if (minNext <= 1) hints += '<div class="hint cold">❄️ Bis zu ' + Math.round(minNext) + '° – Frost möglich, Autoscheibe!</div>';

  // Stundenleiste (8 Stunden)
  var hourly = '';
  for (var h = start + 1; h <= start + 8 && h < d.hourly.time.length; h++) {
    var hw = wmo(d.hourly.weather_code[h], d.hourly.is_day[h]);
    var p = d.hourly.precipitation_probability[h];
    hourly += '<div><div class="h">' + parseInt(d.hourly.time[h].substring(11, 13), 10) + ' h</div><div class="i">' + hw[0] +
      '</div><div class="v">' + Math.round(d.hourly.temperature_2m[h]) + '°</div><div class="p">' + (p >= 20 ? p + ' %' : '') + '</div></div>';
  }

  // Tage
  var daily = '';
  for (var j = 0; j < 5 && j < d.daily.time.length; j++) {
    var dt = new Date(d.daily.time[j] + 'T12:00:00');
    var dw = wmo(d.daily.weather_code[j], 1);
    var dp = d.daily.precipitation_probability_max[j];
    daily += '<div><div class="n">' + (j === 0 ? 'Heute' : TAGE_K[dt.getDay()]) + '</div><div class="i">' + dw[0] +
      '</div><div class="mm">' + Math.round(d.daily.temperature_2m_max[j]) + '° <span>' + Math.round(d.daily.temperature_2m_min[j]) +
      '°</span></div><div class="p">' + (dp != null && dp >= 20 ? '💧' + dp + ' %' : '&nbsp;') + '</div></div>';
  }

  card.innerHTML = '<h2>Wetter</h2>' +
    '<div class="w-now"><div class="ico">' + w[0] + '</div><div><div class="t">' + t + '°</div></div>' +
    '<div style="margin-left:16px"><div class="desc">' + w[1] + '</div><div class="sub">gefühlt ' + Math.round(c.apparent_temperature) +
    '° · 💧 ' + c.relative_humidity_2m + ' % · 💨 ' + Math.round(c.wind_speed_10m) + ' km/h</div></div></div>' +
    '<div class="hints">' + hints + '</div>' +
    '<div class="hourly">' + hourly + '</div>' +
    '<div class="daily">' + daily + '</div>' +
    '<div class="sun">🌅 ' + d.daily.sunrise[0].substring(11) + ' · 🌇 ' + d.daily.sunset[0].substring(11) + '</div>';
}

/* ---------------- Kalender ---------------- */
function loadCalendar(){
  if (!CONFIG.kalenderApi) { state.cal = demoData(); state.isDemo = true; renderCalendar(); renderStatus(); return; }
  var url = CONFIG.kalenderApi + (CONFIG.kalenderApi.indexOf('?') < 0 ? '?' : '&') +
    'days=' + CONFIG.tageVoraus + '&token=' + encodeURIComponent(CONFIG.token) + '&t=' + Date.now();
  fetch(url).then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      state.cal = d; state.isDemo = false; state.calError = false; state.calTime = new Date();
      saveCache('cal', d);
      renderCalendar(); renderStatus();
    })
    .catch(function(){ state.calError = true; if (!state.cal) renderCalendar(); renderStatus(); });
}

function eventsForDay(day){
  var ds = midnight(day), de = addDays(ds, 1), out = [];
  var evs = (state.cal && state.cal.events) || [];
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i], s = new Date(e.start), en = new Date(e.end);
    if (s < de && en > ds) out.push({ e:e, s:s, en:en });
  }
  out.sort(function(a, b){
    if (a.e.allDay !== b.e.allDay) return a.e.allDay ? -1 : 1;
    return a.s - b.s;
  });
  return out;
}

function evHtml(x, now){
  var e = x.e, time;
  if (e.allDay) time = 'Ganztägig';
  else time = hm(x.s) + ' – ' + hm(x.en);
  var cls = 'ev';
  if (!e.allDay && x.en < now) cls += ' past';
  else if (!e.allDay && x.s <= now && x.en > now) cls += ' now';
  var meta = esc(e.calendar || '') + (e.location ? ' · ' + esc(e.location) : '');
  return '<div class="' + cls + '"><div class="bar" style="background:' + esc(e.color || '#4f9cf7') + '"></div><div class="body">' +
    '<div class="time">' + time + '</div><div class="title">' + esc(e.title || '(ohne Titel)') + '</div>' +
    (meta ? '<div class="meta">' + meta + '</div>' : '') + '</div></div>';
}

function renderCalendar(){
  var now = new Date(), today = midnight(now);

  if (!state.cal) {
    $('agenda').innerHTML = '<div class="empty">Kalender gerade nicht erreichbar.</div>';
    return;
  }

  // Terminliste (Start)
  var html = '';
  for (var i = 0; i < CONFIG.tageVoraus; i++) {
    var day = addDays(today, i), evs = eventsForDay(day);
    if (i > 1 && !evs.length) continue;  // leere Tage ab übermorgen ausblenden
    html += '<div class="day"><div class="day-label' + (i === 0 ? '' : ' other') + '">' + dayLabel(day) + '</div>';
    if (!evs.length) html += '<div class="empty">Keine Termine</div>';
    for (var k = 0; k < evs.length; k++) html += evHtml(evs[k], now);
    html += '</div>';
  }
  $('agenda').innerHTML = html;

  // Legende
  var cals = state.cal.calendars || [], lg = '';
  for (var c = 0; c < cals.length; c++) lg += '<span class="chip"><i style="background:' + esc(cals[c].color) + '"></i>' + esc(cals[c].name) + '</span>';
  $('legend').innerHTML = lg;

  // Wochenansicht
  var wk = '';
  for (var d = 0; d < 7; d++) {
    var wd = addDays(today, d), wevs = eventsForDay(wd);
    wk += '<div class="wcol' + (d === 0 ? ' today' : '') + '"><div class="wh"><b>' + (d === 0 ? 'Heute' : TAGE_K[wd.getDay()]) +
      '</b><span>' + wd.getDate() + '.' + (wd.getMonth() + 1) + '.</span></div>';
    if (!wevs.length) wk += '<div class="empty" style="text-align:center;font-size:13px">–</div>';
    for (var m = 0; m < wevs.length; m++) wk += evHtml(wevs[m], now);
    wk += '</div>';
  }
  $('week').innerHTML = wk;

  renderSchool();
}

/* ---------------- Stundenplan ---------------- */
var TAGE_KURZ_SCHULE = ['Mo','Di','Mi','Do','Fr'];

// Welcher Schultag wird gezeigt? Mo–Fr vor schuleMorgenAb = heute, sonst nächster Wochentag
function schoolDay(){
  var n = new Date(), d = midnight(n), wd = n.getDay();
  if (wd >= 1 && wd <= 5 && n.getHours() < CONFIG.schuleMorgenAb) return d;
  do { d = addDays(d, 1); } while (d.getDay() === 0 || d.getDay() === 6);
  return d;
}

// Ferien/Feiertag an diesem Tag? (ganztägiger Termin mit "Ferien" im Titel oder aus einem Feiertags-/Ferienkalender)
function freeDayReason(day){
  var evs = eventsForDay(day);
  for (var i = 0; i < evs.length; i++) {
    var e = evs[i].e;
    if (!e.allDay) continue;
    if (/ferien/i.test(e.title || '') || /feiertag|ferien/i.test(e.calendar || '')) return e.title;
  }
  return '';
}

function lessonsOf(kind, idx){
  var out = [];
  for (var i = 0; i < kind.rows.length; i++) {
    var f = kind.rows[i].tage[idx];
    if (f) out.push({ stunde: kind.rows[i].stunde, zeit: kind.rows[i].zeit, fach: f });
  }
  return out;
}

function bringFor(lessons, hinweise){
  var out = [], seen = {};
  for (var key in hinweise) {
    if (!hinweise.hasOwnProperty(key)) continue;
    for (var i = 0; i < lessons.length; i++) {
      if (lessons[i].fach.toLowerCase().indexOf(key.toLowerCase()) >= 0 && !seen[key]) { seen[key] = 1; out.push(hinweise[key]); }
    }
  }
  return out;
}

function renderSchool(){
  var tile = $('schoolTile');
  var sp = state.cal && state.cal.stundenplan;
  if (!sp || !sp.kinder || !sp.kinder.length) {
    tile.style.display = sp === undefined ? '' : 'none';  // kein Stundenplan eingerichtet → Kachel ausblenden
    if (sp === undefined) tile.innerHTML = '<h2>Schule</h2><div class="empty">Kein Stundenplan eingerichtet.</div>';
    $('plans').innerHTML = '<div class="card notice">Noch kein Stundenplan. Lege ihn in Google Sheets an (siehe Anleitung, Schritt B).</div>';
    return;
  }
  tile.style.display = '';

  var day = schoolDay(), idx = day.getDay() - 1;
  var label = dayLabel(day);
  if (label.indexOf(',') > 0) label = TAGE[day.getDay()];
  var free = freeDayReason(day);

  var html = '<h2>Schule · ' + esc(label) + '</h2>';
  if (free) {
    html += '<div class="free">🎉 Frei – ' + esc(free) + '</div>';
  } else {
    html += '<div class="kids">';
    for (var k = 0; k < sp.kinder.length; k++) {
      var kind = sp.kinder[k], ls = lessonsOf(kind, idx);
      html += '<div><div class="who">' + esc(kind.name) + '</div>';
      if (!ls.length) { html += '<div class="until">kein Unterricht eingetragen</div></div>'; continue; }
      // Unterricht (Zeilen mit Zeit) und Nachmittag (Zeilen ohne Zeit) trennen
      var names = [], extra = [], ende = '';
      for (var i = 0; i < ls.length; i++) {
        if (!ls[i].zeit) { extra.push(ls[i].fach); continue; }
        if (ls[i].zeit.indexOf('-') > 0) ende = ls[i].zeit.split('-')[1].trim();
        if (CONFIG.nichtInKachel.indexOf(ls[i].fach) >= 0) continue;
        if (!names.length || names[names.length - 1] !== ls[i].fach) names.push(ls[i].fach);
      }
      if (names.length) html += '<div class="subj">' + esc(names.join(', ')) + '</div>';
      if (ende) html += '<div class="until">Schluss ca. ' + esc(ende) + ' Uhr</div>';
      if (extra.length) html += '<div class="subj">➜ ' + esc(extra.join(', ')) + '</div>';
      var bring = bringFor(ls, sp.hinweise || {});
      for (var b = 0; b < bring.length; b++) html += '<span class="bring">🎒 ' + esc(bring[b]) + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }
  tile.innerHTML = html;

  // Ansicht "Schule": volle Wochenpläne
  var ph = '';
  for (var p = 0; p < sp.kinder.length; p++) {
    var kd = sp.kinder[p];
    ph += '<div class="card plan"><h2>' + esc(kd.name) + '</h2><table><tr><th></th>';
    for (var t = 0; t < 5; t++) ph += '<th' + (t === idx ? ' class="hl"' : '') + '>' + TAGE_KURZ_SCHULE[t] + '</th>';
    ph += '</tr>';
    for (var r = 0; r < kd.rows.length; r++) {
      var row = kd.rows[r];
      ph += '<tr><td class="n">' + esc(row.stunde) + (/^\d+$/.test(row.stunde) ? '.' : '') + (row.zeit ? '<br>' + esc(row.zeit) : '') + '</td>';
      for (var c = 0; c < 5; c++) {
        var f = row.tage[c];
        ph += '<td class="' + (f ? '' : 'e') + (c === idx && f ? ' hl' : '') + '">' + esc(f) + '</td>';
      }
      ph += '</tr>';
    }
    ph += '</table></div>';
  }
  $('plans').innerHTML = ph;
}

/* Demo-Termine, solange keine Kalender-URL eingetragen ist */
function demoData(){
  var t = midnight(new Date());
  function at(day, h, m, dur){ var s = addDays(t, day); s.setHours(h, m, 0, 0); return [s.toISOString(), new Date(s.getTime() + dur * 60000).toISOString()]; }
  function allDay(day, days){ return [addDays(t, day).toISOString(), addDays(t, day + (days || 1)).toISOString()]; }
  var C = { fam:['Familie','#4f9cf7'], arb:['Arbeit','#f5a524'], kid:['Kinder','#22c55e'], spo:['Sport','#e879f9'] };
  function ev(title, r, cal, ad, loc){ return { title:title, start:r[0], end:r[1], allDay:!!ad, calendar:C[cal][0], color:C[cal][1], location:loc || '' }; }
  return {
    calendars: [ {name:'Familie',color:'#4f9cf7'}, {name:'Arbeit',color:'#f5a524'}, {name:'Kinder',color:'#22c55e'}, {name:'Sport',color:'#e879f9'} ],
    events: [
      ev('Gelbe Tonne rausstellen', allDay(0), 'fam', true),

      ev('Bürdemessung UW', at(1, 9, 30, 180), 'arb'),
      ev('Schwimmkurs', at(1, 16, 0, 60), 'kid', false, 'Elbe-Schwimmhalle'),
      ev('Laufgruppe', at(2, 18, 30, 60), 'spo'),
      ev('Elternabend', at(3, 19, 0, 90), 'kid'),
      ev('Herbstferien', allDay(4, 3), 'kid', true),
      ev('Grillen bei Freunden', at(5, 17, 0, 240), 'fam')
    ],
    stundenplan: {
      kinder: [
        { name: 'Ilse', rows: [
          { stunde:'1', zeit:'08:00-08:45', tage:['Mathe','Mathe','Betreuung','Betreuung','Sport'] },
          { stunde:'2', zeit:'09:00-09:45', tage:['Mathe','Mathe','Mathe','Religion','Sport'] },
          { stunde:'3', zeit:'10:05-10:50', tage:['Deutsch','Deutsch','Deutsch','Mathe','Kunst'] },
          { stunde:'4', zeit:'10:55-11:40', tage:['Deutsch','AG','Deutsch','Deutsch','Kunst'] },
          { stunde:'5', zeit:'11:40-12:15', tage:['Mittagessen','Mittagessen','Mittagessen','Mittagessen','Mittagessen'] },
          { stunde:'6', zeit:'12:15-13:00', tage:['Sachkunde','Kunst','Musik','Sachkunde','Betreuung'] },
          { stunde:'7', zeit:'13:00-13:45', tage:['','','Sachkunde','',''] },
          { stunde:'Nachm.', zeit:'', tage:['Judo 14:15-15:30','Schachzwerge 13:15-14:00','','Kinderyoga 14:00-15:00',''] },
          { stunde:'Nachm.', zeit:'', tage:['','','','Tanzen 16:00-17:00',''] }
        ]}
      ],
      hinweise: { 'Sport':'Sportzeug', 'Judo':'Judoanzug', 'Tanzen':'Tanzsachen', 'Kunst':'Kunstsachen' }
    }
  };
}

/* ---------------- Statuszeile ---------------- */
function renderStatus(){
  var s = [];
  if (state.weatherTime) s.push('Wetter ' + hm(state.weatherTime) + (state.weatherError ? ' ⚠' : ''));
  if (state.calTime) s.push('Kalender ' + hm(state.calTime) + (state.calError ? ' ⚠' : ''));
  else if (state.calError) s.push('Kalender ⚠');
  $('status').textContent = s.join(' · ');
  $('demo').textContent = state.isDemo ? 'Demo-Termine – Kalender-URL in CONFIG eintragen' : '';
}

/* ---------------- Start ---------------- */
tick();
// zuletzt gespeicherte Daten sofort zeigen, dann frisch laden
(function(){
  var w = readCache('weather');
  if (w && w.v) { state.weather = w.v; state.weatherTime = new Date(w.t); renderWeather(); }
  var c = readCache('cal');
  if (c && c.v && CONFIG.kalenderApi) { state.cal = c.v; state.calTime = new Date(c.t); renderCalendar(); }
  renderStatus();
})();
loadWeather();
loadCalendar();
setInterval(tick, 1000);
setInterval(loadWeather, 15 * 60000);          // Wetter alle 15 min
setInterval(loadCalendar, 5 * 60000);          // Termine alle 5 min
setInterval(function(){ if (state.cal) renderCalendar(); }, 60000);  // "läuft gerade"-Markierung
setTimeout(function(){ location.reload(); }, 6 * 3600000);           // alle 6 h neu laden (alte Tablets)
</script>
